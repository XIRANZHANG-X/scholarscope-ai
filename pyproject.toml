[project]
name = "scholarscope-ai"
version = "0.1.0"
description = "Reproducible bibliometric study of retrieval-augmented generation (RAG) research, 2019-2026: OpenAlex + ROR + World Bank -> PostgreSQL -> SQL -> figures and a single-file website"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Database: PostgreSQL driver, ORM core for read-only queries, schema migrations
    "psycopg[binary,pool]>=3.3",
    "sqlalchemy>=2.0",
    "alembic>=1.20",
    # Data collection: OpenAlex / ROR / World Bank APIs with retries, validated settings
    "httpx>=0.28",
    "tenacity>=9.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.2.3",
    # Analysis and figures
    "pandas>=3.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "matplotlib>=3.11.2",
    # Website: interactive charts and the page template
    "plotly>=7.1",
    "jinja2>=3.1",
]

[project.scripts]
scholarscope = "scholarscope.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.uv.build-backend]
module-name = "scholarscope"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs the PostgreSQL service from compose.yaml (docker compose up -d)"]
