# ScholarScope AI local services (architecture §12).
#   docker compose up -d                   -> PostgreSQL only (all ETL and analysis work)
#   docker compose --profile graph up -d   -> PostgreSQL + Neo4j (graph milestone)
#   docker compose --profile ui up -d      -> PostgreSQL + pgAdmin on http://127.0.0.1:5050
# Images are pinned to the tags verified on 2026-09-22; offline backups live in D:\Docker\images\.

name: scholarscope

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - max_wal_size=4GB
    # Parallel HNSW index builds need more than Docker's default 64 MB of shared memory.
    shm_size: 1gb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP, so the check stays red while initdb's socket-only bootstrap server is running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Browse the tables without installing anything. Opt-in, local-only, holds no project data.
  pgadmin:
    image: dpage/pgadmin4:9.9
    profiles: ["ui"]
    environment:
      # pgAdmin validates this as a real address: it needs a dot and rejects reserved TLDs
      # such as .local. It is only a local login name; no mail is ever sent.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # Pre-registers the connection, so the server is already in the tree on first login.
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:2026.08.1-community-trixie
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  neo4jdata:
